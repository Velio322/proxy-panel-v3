# ══════════════════════════════════════════════════════════════
# ProxPanel v3 — High-Performance Kernel & Network Tuning
# Path: /etc/sysctl.d/99-proxpanel.conf
# ══════════════════════════════════════════════════════════════

# ── Enable BBR Congestion Control & FQ ──
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ── IP Packet Forwarding (for VPN/Tunnels) ──
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.default.forwarding = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# ── Socket Max Connections & Backlog Queues ──
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 100000
net.ipv4.tcp_max_syn_backlog = 65535
net.core.optmem_max = 65536

# ── Max File Descriptors ──
fs.file-max = 2097152

# ── TCP & UDP Socket Memory Buffers (10Gbps+ Ready) ──
# 64MB Max Buffers for high-speed high-latency WAN links
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Vector: min default max (bytes)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# ── TCP Optimization & Fast Open ──
# 3 = enable client and server TCP Fast Open
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_max_tw_buckets = 1440000
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# ── Virtual Memory Paging ──
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
